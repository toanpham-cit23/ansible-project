<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Lab</title>
<link rel="stylesheet" href="/static/css/app.css?v=7">
</head>
<body class="login-body">
<main class="login-card">
  <h1>Lab</h1>
  <p class="muted">Network automation console</p>
  <form id="f" autocomplete="on">
    <label for="u">Username</label>
    <input id="u" name="username" autofocus required maxlength="64" autocomplete="username">
    <label for="p">Password</label>
    <input id="p" name="password" type="password" required maxlength="256" autocomplete="current-password">
    <button type="submit">Sign in</button>
    <p id="err" class="err" hidden></p>
  </form>
</main>
<script src="/static/js/api.js?v=7" defer></script>
<script src="/static/js/login.js?v=7" defer></script>
</body>
</html>
