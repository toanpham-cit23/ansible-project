name: lab
services:
  api:
    build:
      context: .
      dockerfile: docker/api-go/Dockerfile
    image: lab/api:1.0
    container_name: lab-api
    restart: unless-stopped
    environment:
      NETDB: /data/net.db
      NETDB_KEY: ${NETDB_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      COOKIE_SECURE: "false"
      STATIC_DIR: /app/static
      GOGC: "40"
      GOMEMLIMIT: 40MiB
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # the API sends the test mail and the handover redispatch, so it needs
      # the same relay settings and the same outbox directory as the poller
      MAIL_DIR: /data/outbox
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-lab@lab.local}
      # optional DNS. The responder listens on a high port inside the
      # container and is published on 53 outside, so it works without the
      # CAP_NET_BIND_SERVICE the container deliberately does not have.
      LAB_DNS_LISTEN: ${LAB_DNS_LISTEN:-:5353}
      LAB_DNS_UPSTREAM: ${LAB_DNS_UPSTREAM:-}
      LAB_DNS_PUBLIC_PORT: ${LAB_DNS_PUBLIC_PORT:-53}
    volumes:
      - ./db:/data
    ports:
      - "8080:8000"
      # UDP only: a zone this small is answered from memory in one packet
      - "53:5353/udp"
    mem_limit: 80m
    cpus: 0.50
    read_only: true
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  poller:
    build: ./docker/poller
    image: lab/poller:1.0
    container_name: lab-poller
    restart: unless-stopped
    network_mode: host
    user: "10001:10001"
    environment:
      NETDB: /data/net.db
      NETDB_KEY: ${NETDB_KEY:-}
      # 5 s as required. The cadence is kept honest by subtracting the time a
      # cycle takes, so a slow walk does not drift the interval.
      POLL_INTERVAL: "5"
      ALERT_WEBHOOK: ${ALERT_WEBHOOK:-}
      # where the .eml fallback lands when no SMTP relay is configured
      MAIL_DIR: /data/outbox
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-lab@lab.local}
    volumes:
      - ./db:/data
    mem_limit: 48m
    cpus: 0.25
    read_only: true
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
