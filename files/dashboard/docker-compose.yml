name: lab
services:
  api:
    build:
      context: .
      dockerfile: docker/api-go/Dockerfile
    image: lab/api:1.0
    container_name: lab-api
    restart: unless-stopped
    environment:
      NETDB: /data/net.db
      NETDB_KEY: ${NETDB_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STATIC_DIR: /app/static
      # Trusted certificate, installed into ./db/certs by ops/acme-issue.sh.
      # Both files are optional: without them only the HTTP listener starts.
      TLS_CERT: /data/certs/fullchain.pem
      TLS_KEY: /data/certs/key.pem
      TLS_PORT: "8443"
      GOGC: "40"
      GOMEMLIMIT: 40MiB
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # the API sends the test mail and the handover redispatch, so it needs
      # the same relay settings and the same outbox directory as the poller
      MAIL_DIR: /data/outbox
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-lab@lab.local}
      # optional DNS. The responder listens on a high port inside the
      # container and is published on 53 outside, so it works without the
      # CAP_NET_BIND_SERVICE the container deliberately does not have.
      LAB_DNS_LISTEN: ${LAB_DNS_LISTEN:-:5353}
      LAB_DNS_UPSTREAM: ${LAB_DNS_UPSTREAM:-}
      LAB_DNS_PUBLIC_PORT: ${LAB_DNS_PUBLIC_PORT:-53}
      # ---- Telegram incident alerts (internal alerts ONLY, not end-user mail)
      # Leave empty here and either put real values in an untracked .env or
      # paste them once as admin in the dashboard Settings screen. A token
      # entered in the UI is AES-GCM encrypted in SQLite, never plaintext.
      # Placeholders for the operator to fill in later:
      #   TELEGRAM_BOT_TOKEN=YOUR_BOT_TOKEN_HERE      (from BotFather)
      #   TELEGRAM_CHAT_ID=YOUR_CHAT_ID_HERE         (group id, e.g. -1001234567890)
      #   TELEGRAM_BOT_USERNAME=YOUR_BOT_USERNAME_HERE
      #   MEMBERS=YOUR_ONCALL_USERNAMES_HERE         (comma separated, optional)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      MEMBERS: ${MEMBERS:-}
    volumes:
      - ./db:/data
    ports:
      - "8080:8000"
      - "8443:8443"
      # UDP only: a zone this small is answered from memory in one packet
      - "53:5353/udp"
    mem_limit: 80m
    cpus: 0.50
    read_only: true
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  poller:
    build: ./docker/poller
    image: lab/poller:1.0
    container_name: lab-poller
    restart: unless-stopped
    network_mode: host
    user: "10001:10001"
    environment:
      NETDB: /data/net.db
      NETDB_KEY: ${NETDB_KEY:-}
      # 5 s as required. The cadence is kept honest by subtracting the time a
      # cycle takes, so a slow walk does not drift the interval.
      POLL_INTERVAL: "5"
      ALERT_WEBHOOK: ${ALERT_WEBHOOK:-}
      # where the .eml fallback lands when no SMTP relay is configured
      MAIL_DIR: /data/outbox
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-lab@lab.local}
    volumes:
      - ./db:/data
    mem_limit: 48m
    cpus: 0.25
    read_only: true
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
