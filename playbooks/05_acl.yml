---
- name: ACL Configuration for Routers
  hosts: routers
  gather_facts: no
  tasks:
    - name: Configure standard ACL and apply it to VTY lines
      ansible.builtin.shell: |
        vtysh -c 'conf t' \
              -c 'no access-list 10' \
              -c 'access-list 10 permit 192.168.23.0 0.0.0.255' \
              -c 'access-list 10 deny any' \
              -c 'end'
              -c 'write memory'
      register: acl_result
      changed_when: "'Failed' not in acl_result.stderr"
      failed_when: "'Unknown command' in acl_result.stderr or 'Incomplete command' in acl_result.stderr"

    - name: Result
      ansible.builtin.debug:
        var: acl_result.stdout_lines

    - name: Verify ACL exists in running configuration
      ansible.builtin.shell: |
        TERM=dumb vtysh -c 'show run' 2>&1 | grep 'access-list 10' && echo "ACL_OK" || echo "ACL_NOT_FOUND"
      register: acl_verify
      changed_when: false

    - name: Show ACL verification
      ansible.builtin.debug:
       var: acl_verify.stdout_lines

    - name: Final status
      ansible.builtin.debug:
        msg: "ACL configuration completed on {{ inventory_hostname }}: SUCCESS"
