---
# 12_phpipam.yml - Deploy phpIPAM on the controller (192.168.23.10) with Docker
# Run: ansible-playbook playbooks/12_phpipam.yml
#
# What it does:
#   1. Makes sure Docker + compose plugin are available on the controller
#   2. Deploys phpIPAM (web + cron + MariaDB) with docker compose
#   3. Generates an IP inventory CSV of all routers for import into phpIPAM
#   4. Optionally seeds the 192.168.23.0/24 subnet through the phpIPAM API
#
# Optional extra vars (API seeding):
#   -e phpipam_api_app_id=ansible -e phpipam_api_token=<token>
- name: Deploy phpIPAM IP Address Management
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    project_dir: /root/ansible-project
    phpipam_dir: /root/phpipam
    # 8080 is reserved for the Zabbix frontend (13_zabbix_server.yml)
    phpipam_port: 8081
    phpipam_tz: Asia/Ho_Chi_Minh
    phpipam_db_name: phpipam
    phpipam_db_user: phpipam
    phpipam_db_pass: "{{ vault_phpipam_db_pass | default('phpipamadmin') }}"
    phpipam_db_root_pass: "{{ vault_phpipam_db_root_pass | default('phpipamroot') }}"
    phpipam_url: "http://192.168.23.10:{{ phpipam_port }}"
  tasks:
    # ---------- 1. Docker prerequisites ----------
    - name: Check docker availability
      ansible.builtin.shell: command -v docker || echo NOT_FOUND
      register: docker_bin
      changed_when: false
      failed_when: false

    - name: Install docker on Alpine controller
      ansible.builtin.shell: |
        apk add --no-cache docker docker-cli-compose 2>&1 | tail -5
        rc-update add docker default
        rc-service docker start
        sleep 5
      register: docker_install
      when: docker_bin.stdout | trim == 'NOT_FOUND'
      changed_when: docker_install.rc == 0
      failed_when: false

    - name: Show docker install result
      ansible.builtin.debug:
        var: docker_install.stdout_lines | default(['docker already present'])

    - name: Check docker daemon is running
      ansible.builtin.shell: docker info > /dev/null 2>&1 && echo DOCKER_OK || echo DOCKER_DOWN
      register: docker_daemon
      changed_when: false
      failed_when: false

    - name: Start docker daemon if it is down
      ansible.builtin.shell: |
        rc-service docker start 2>/dev/null || service docker start 2>/dev/null || true
        sleep 5
        docker info > /dev/null 2>&1 && echo DOCKER_OK || echo DOCKER_DOWN
      register: docker_start
      when: docker_daemon.stdout | trim == 'DOCKER_DOWN'
      changed_when: false
      failed_when: false

    - name: Stop if docker is not usable
      ansible.builtin.fail:
        msg: >-
          Docker is not usable on this host. Install it manually
          (apk add docker docker-cli-compose; rc-service docker start) and run again.
      when: >-
        (docker_daemon.stdout | trim == 'DOCKER_DOWN') and
        (docker_start.stdout | default('DOCKER_DOWN') | trim == 'DOCKER_DOWN')

    - name: Detect docker compose command
      ansible.builtin.shell: |
        if docker compose version > /dev/null 2>&1; then
          echo "docker compose"
        elif command -v docker-compose > /dev/null 2>&1; then
          echo "docker-compose"
        else
          echo NONE
        fi
      register: compose_cmd
      changed_when: false
      failed_when: false

    - name: Stop if docker compose is missing
      ansible.builtin.fail:
        msg: "docker compose / docker-compose not found. Install docker-cli-compose and run again."
      when: compose_cmd.stdout | trim == 'NONE'

    - name: Show compose command
      ansible.builtin.debug:
        var: compose_cmd.stdout

    # ---------- 2. Project layout ----------
    - name: Create phpIPAM directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0750'
      loop:
        - "{{ phpipam_dir }}"
        - "{{ phpipam_dir }}/import"

    - name: Deploy docker-compose.yml
      ansible.builtin.copy:
        content: |
          # phpIPAM stack - managed by Ansible (12_phpipam.yml)
          services:
            phpipam-web:
              image: phpipam/phpipam-www:latest
              container_name: phpipam
              restart: unless-stopped
              ports:
                - "{{ phpipam_port }}:80"
              environment:
                TZ: "{{ phpipam_tz }}"
                IPAM_DATABASE_HOST: phpipam-mariadb
                IPAM_DATABASE_NAME: "{{ phpipam_db_name }}"
                IPAM_DATABASE_USER: "{{ phpipam_db_user }}"
                IPAM_DATABASE_PASS: "{{ phpipam_db_pass }}"
                IPAM_DATABASE_WEBHOST: "%"
              volumes:
                - phpipam-logo:/phpipam/css/images/logo
              depends_on:
                - phpipam-mariadb

            phpipam-cron:
              image: phpipam/phpipam-cron:latest
              container_name: phpipam-cron
              restart: unless-stopped
              environment:
                TZ: "{{ phpipam_tz }}"
                IPAM_DATABASE_HOST: phpipam-mariadb
                IPAM_DATABASE_NAME: "{{ phpipam_db_name }}"
                IPAM_DATABASE_USER: "{{ phpipam_db_user }}"
                IPAM_DATABASE_PASS: "{{ phpipam_db_pass }}"
                IPAM_DATABASE_WEBHOST: "%"
                SCAN_INTERVAL: 1h
              depends_on:
                - phpipam-mariadb

            phpipam-mariadb:
              image: mariadb:10.11
              container_name: phpipam-mariadb
              restart: unless-stopped
              environment:
                TZ: "{{ phpipam_tz }}"
                MYSQL_ROOT_PASSWORD: "{{ phpipam_db_root_pass }}"
                MYSQL_DATABASE: "{{ phpipam_db_name }}"
                MYSQL_USER: "{{ phpipam_db_user }}"
                MYSQL_PASSWORD: "{{ phpipam_db_pass }}"
              volumes:
                - phpipam-db-data:/var/lib/mysql

          volumes:
            phpipam-db-data:
            phpipam-logo:
        dest: "{{ phpipam_dir }}/docker-compose.yml"
        mode: '0640'
      register: compose_file

    - name: Validate compose file
      ansible.builtin.shell: "{{ compose_cmd.stdout }} config > /dev/null && echo COMPOSE_VALID || echo COMPOSE_INVALID"
      args:
        chdir: "{{ phpipam_dir }}"
      register: compose_validate
      changed_when: false
      failed_when: false

    - name: Show compose validation
      ansible.builtin.debug:
        var: compose_validate.stdout

    # ---------- 3. Start the stack ----------
    - name: Start phpIPAM stack
      ansible.builtin.shell: "{{ compose_cmd.stdout }} up -d 2>&1 | tail -15"
      args:
        chdir: "{{ phpipam_dir }}"
      register: compose_up
      changed_when: compose_up.rc == 0
      failed_when: false

    - name: Show stack start output
      ansible.builtin.debug:
        var: compose_up.stdout_lines

    - name: Wait for containers to become ready
      ansible.builtin.pause:
        seconds: 15

    - name: List running containers
      ansible.builtin.shell: docker ps --filter "name=phpipam" --format '{{ "{{" }}.Names{{ "}}" }} {{ "{{" }}.Status{{ "}}" }}'
      register: docker_ps
      changed_when: false
      failed_when: false

    - name: Show container status
      ansible.builtin.debug:
        var: docker_ps.stdout_lines

    # ---------- 4. Health checks ----------
    - name: Check phpIPAM web interface
      ansible.builtin.uri:
        url: "{{ phpipam_url }}/"
        method: GET
        status_code: [200, 301, 302, 303]
        timeout: 15
      register: phpipam_http
      retries: 12
      delay: 5
      until: phpipam_http.status is defined
      failed_when: false

    - name: Check database schema state
      ansible.builtin.shell: |
        docker exec phpipam-mariadb mysql -u{{ phpipam_db_user }} -p{{ phpipam_db_pass }} -N \
          -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='{{ phpipam_db_name }}';" \
          2>/dev/null | tr -d '[:space:]'
      register: db_tables
      changed_when: false
      failed_when: false

    - name: Show install state
      ansible.builtin.debug:
        msg:
          - "HTTP status: {{ phpipam_http.status | default('NO RESPONSE') }}"
          - "Tables in DB: {{ db_tables.stdout | default('0') }}"
          - >-
            {{ 'READY - open ' ~ phpipam_url
               if (db_tables.stdout | default('0') | trim | int) > 20
               else 'INSTALL REQUIRED - open ' ~ phpipam_url ~ '/install/ and finish the wizard' }}

    # ---------- 5. Inventory export for import ----------
    - name: Generate router inventory CSV for phpIPAM import
      ansible.builtin.copy:
        content: |
          hostname,ip_address,subnet,mask,description,os
          {% for h in groups['routers'] %}
          {{ h }},{{ hostvars[h]['ansible_host'] | default('') }},192.168.23.0,24,FRR router {{ h }} (loopback {{ hostvars[h]['loopback_ip'] | default('-') }}),FRR-Alpine
          {% endfor %}
        dest: "{{ phpipam_dir }}/import/routers.csv"
        mode: '0640'

    - name: Show generated inventory
      ansible.builtin.command: cat "{{ phpipam_dir }}/import/routers.csv"
      register: csv_preview
      changed_when: false

    - name: Show CSV preview
      ansible.builtin.debug:
        var: csv_preview.stdout_lines

    # ---------- 6. Optional API seeding ----------
    - name: Seed subnet through phpIPAM API
      ansible.builtin.uri:
        url: "{{ phpipam_url }}/api/{{ phpipam_api_app_id | default('') }}/subnets/"
        method: POST
        headers:
          token: "{{ phpipam_api_token | default('') }}"
        body_format: json
        body:
          subnet: "192.168.23.0"
          mask: "24"
          description: "Core routers - managed by Ansible"
          sectionId: "1"
        status_code: [200, 201, 409]
      register: api_seed
      when: phpipam_api_token | default('') | length > 0
      failed_when: false

    - name: Show API seeding result
      ansible.builtin.debug:
        var: api_seed.json | default('skipped - no API token supplied')
      when: phpipam_api_token | default('') | length > 0

    - name: Final status
      ansible.builtin.debug:
        msg: >-
          phpIPAM stack on controller:
          url={{ phpipam_url }}
          | containers={{ docker_ps.stdout_lines | default([]) | length }}
          | compose={{ compose_cmd.stdout | trim }}
          | csv={{ phpipam_dir }}/import/routers.csv
