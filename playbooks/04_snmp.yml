
---
- name: SNMP Configuration
  hosts: routers
  gather_facts: no
  tasks:
    - name: Clean old packages
      ansible.builtin.file:
        path: /tmp/snmp-pkgs
        state: absent
    - name: Create /tmp/snmp-pkgs directory
      ansible.builtin.file:
        path: /tmp/snmp-pkgs
        state: directory
        mode: '0755'
    - name: Check SNMP packages on control node
      ansible.builtin.stat:
        path: /root/ansible-project/files/snmp
      delegate_to: localhost
      register: snmp_pkg_dir
      changed_when: false

    - name: Stop if SNMP packages are missing
      ansible.builtin.fail:
        msg: >-
          files/snmp/ not found on the control node (it is gitignored, so a fresh
          clone does not have it). Copy the snmpd .apk packages there and run again.
      when: (not snmp_pkg_dir.stat.exists) or (lookup('fileglob', '/root/ansible-project/files/snmp/*.apk', wantlist=True) | length == 0)

    - name: Copy all SNMP package to router
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /tmp/snmp-pkgs
        mode: '0644'
      with_fileglob:
        - /root/ansible-project/files/snmp/*.apk
    - name: Install all packages from local file
      ansible.builtin.shell: apk add --allow-untrusted --no-network /tmp/snmp-pkgs/*.apk
      register: snmp_install
      # This used to have no failure test, so a failed install was reported as
      # success and the play carried on to configure a daemon that was not
      # there. That is how the routers ended up with no snmpd at all while the
      # dashboard was told the deployment was fine.
      failed_when: snmp_install.rc != 0
    - name: Restart FRR after package install
      ansible.builtin.shell: |
        rc-service frr stop
        sleep 2
        rc-service frr start
        sleep 3
      register: frr_restart

    # Without this FRR never opens the AgentX socket, so snmpd only answers
    # with Linux system MIBs and shows nothing about OSPF or routes.
    - name: Enable AgentX in FRR
      ansible.builtin.shell: |
        TERM=dumb vtysh -c 'conf t' -c 'agentx' -c 'end' -c 'wr mem'
      register: frr_agentx
      changed_when: "'%' not in frr_agentx.stdout"
      # A vtysh syntax error used to be ignored here. The play then restarted
      # snmpd against a master socket FRR never opened, and `snmpd` answered
      # only Linux MIBs - which is the "SNMP silent" the dashboard saw.
      failed_when: >-
        frr_agentx.rc != 0 or
        'Unknown command' in frr_agentx.stdout or
        'Incomplete command' in frr_agentx.stdout

    - name: Show AgentX output
      ansible.builtin.debug:
        var: frr_agentx.stdout_lines

    - name: Restart FRR to open the AgentX socket
      ansible.builtin.shell: |
        rc-service frr restart 2>/dev/null || { rc-service frr stop; sleep 2; rc-service frr start; }
        sleep 3
      register: frr_agentx_restart
      changed_when: true
      failed_when: false
    - name: Create SNMP config file
      ansible.builtin.copy:
        content: |
          # SNMP Configuration
          # Community is a variable so it is not fixed in source. Override with
          #   -e snmp_community=<value>
          # or set it per host in host_vars. The default is deliberately the
          # well-known "public" so the lab matches the dashboard's seeded
          # snmp_version '2c'; it is NOT suitable for any shared network.
          # v2c sends the community in clear text on every request. For anything
          # beyond an isolated lab, use v3 with auth and priv instead.
          rocommunity {{ snmp_community | default('public') }} {{ snmp_allowed_net | default('192.168.23.0/24') }}
          syslocation "{{ snmp_location | default('Data Center') }}"
          syscontact {{ snmp_contact | default('admin@example.invalid') }}
          agentaddress udp:161
          master agentx
        dest: /etc/snmp/snmpd.conf
        mode: '0644'
      register: snmp_conf
    - name: Verify snmpd binary exists
      ansible.builtin.shell: command -v snmpd || ls /usr/sbin/snmpd
      register: snmpd_library
      changed_when: false
      failed_when: false

    - name: Show snmpd binary path
      ansible.builtin.debug:
        msg: "snmpd binary: {{ snmpd_library.stdout | default('NOT FOUND', true) }}"

    - name: Stop when the snmpd binary is missing after the install
      # The old flow printed "NOT FOUND" and continued to `rc-service snmpd
      # start`, which fails on the else-branch and still reports success. Fail
      # here instead, where the reason is unambiguous.
      ansible.builtin.fail:
        msg: >-
          snmpd is not installed on {{ inventory_hostname }} after apk add.
          Check that the .apk files in files/snmp/ are built for this Alpine
          release (apk add --allow-untrusted still verifies the package
          metadata). Output: {{ snmp_install.stdout }}
      when: snmpd_library.rc != 0

    - name: Enable and start snmpd service
      ansible.builtin.shell: |
        rc-update add snmpd
        rc-service snmpd start
        sleep 2
        rc-service snmpd status
      register: snmpd_start
      failed_when: snmpd_start.rc != 0

    # An snmpd that was started before the new config was written keeps the
    # old community forever. `rc-service snmpd start` is a no-op on a running
    # daemon, so the play went green while v2c requests timed out and the
    # dashboard drew every router as down. Restart whenever the file changed.
    - name: Reload snmpd when its config changed
      ansible.builtin.shell: |
        rc-service snmpd restart
        sleep 2
        rc-service snmpd status
      register: snmpd_restart
      when: snmp_conf.changed
      failed_when: snmpd_restart.rc != 0
      changed_when: true

    - name: Wait for snmpd to be ready
      ansible.builtin.pause:
        seconds: 3

    - name: Verify snmpd and the AgentX socket are up
      ansible.builtin.shell: |
        ps | grep '[s]nmpd' > /dev/null && echo "SNMPD_RUNNING" || echo "SNMPD_DOWN"
        [ -S /var/agentx/master ] && echo "AGENTX_SOCKET_OK" || echo "AGENTX_SOCKET_MISSING"
        # FRR 10.6 on Alpine accepts `agentx` but does not persist it in the
        # integrated config, so its presence is reported, never required.
        TERM=dumb vtysh -c 'show run' 2>/dev/null | grep -q '^agentx' \
          && echo "FRR_AGENTX_OK" || echo "FRR_AGENTX_NOT_PERSISTED"
      register: snmp_verify
      changed_when: false
      failed_when: false

    # This is the check that matters to the dashboard: it polls SNMPv2c with
    # this community. A running daemon that refuses the community is exactly
    # the failure we saw — sysDescr answered v3 only, so every router stayed
    # red while `rc-service snmpd status` said "started".
    - name: Verify snmpd answers the dashboard's community
      ansible.builtin.shell: |
        timeout 8 snmpget -v2c -c "{{ snmp_community | default('public') }}" \
          -t 5 -r 1 "{{ ansible_host }}" 1.3.6.1.2.1.1.1.0 2>&1
      delegate_to: localhost
      register: snmp_answer
      changed_when: false
      failed_when: >-
        snmp_answer.rc != 0 or
        'Timeout' in snmp_answer.stdout or
        'no response' in snmp_answer.stdout or
        'Unknown community' in snmp_answer.stdout

    - name: Show verification
      ansible.builtin.debug:
        msg:
          - "{{ snmp_verify.stdout_lines }}"
          - "SNMP answer: {{ snmp_answer.stdout | trim }}"

    - name: Result
      ansible.builtin.debug:
        msg: "{{ snmpd_start.stdout_lines }}"

    - name: Final status
      ansible.builtin.debug:
        msg: >-
          SNMP on {{ inventory_hostname }}:
          OK - snmpd running and answering v2c with the lab community.
          FRR AgentX data: {{ 'available' if 'FRR_AGENTX_OK' in snmp_verify.stdout else 'not available on this FRR build' }}

    - name: Fail the play when SNMP is not actually working
      # The whole point of this playbook is a working agent. Reporting
      # "PARTIAL" and exiting 0 is what let the lab run for weeks with no
      # usable SNMP, and only the dashboard noticed.
      ansible.builtin.fail:
        msg: >-
          SNMP is not usable on {{ inventory_hostname }}:
          snmpd={{ 'running' if 'SNMPD_RUNNING' in snmp_verify.stdout else 'down' }},
          v2c answer={{ snmp_answer.stdout | trim }}.
          Check /etc/snmp/snmpd.conf for `rocommunity` and /var/log/messages.
      when: >-
        'SNMPD_RUNNING' not in snmp_verify.stdout or
        snmp_answer.rc != 0
