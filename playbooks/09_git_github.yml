---
- name: Push Ansible Project to GitHub
  hosts: localhost
  connection: local
  gather_facts: no
  vars_files: ../token.yml
  vars:
    project_dir: /root/ansible-project
    github_repo: "https://{{ github_token }}@github.com/toanpham-cit23/ansible-project.git"
  
  tasks:
    - name: Safety check - never push plaintext token
      ansible.builtin.shell: | 
        if grep -q ANSIBLE_VAULT {{ project_dir }}/token.yml; then
          echo "TOKEN_ENCRYPTED"
        else
          echo "TOKEN_PLAINTEXT"
        fi
      register: token_safety
      changed_when: false

    - name: Stop push if token is not encrypted
      ansible.builtin.fail:
        msg: "DANGER - token.yml is plaintext. Run 08_vault.yml first, then push."
      when: token_safety.stdout != "TOKEN_ENCRYPTED"

    - name: Show token safety result
      ansible.builtin.debug:
        var: token_safety.stdout_lines

    - name: Write gitgnore file
      ansible.builtin.copy:
        dest: "{{ project_dir }}/.gitignore"
        content: |
          backups/
          **/backups/
          *.conf
          *.retry
          token.yml
          files/
          devnull
          .vault_pass

    - name: Untrack token file
      ansible.builtin.command: git rm --cached token.yml
      args:
        chdir: "{{ project_dir }}"
      failed_when: false

    - name: Untrack vault pass file
      ansible.builtin.command: git rm --cached .vault_pass
      args:
        chdir: "{{ project_dir }}"
      failed_when: false

    - name: Untrack playbooks backups
      ansible.builtin.command: git rm -r --cached playbooks/backups
      args:
        chdir: "{{ project_dir }}"
      failed_when: false

    - name: Untrack root backups
      ansible.builtin.command: git rm -r --cached backups
      args:
        chdir: "{{ project_dir }}"
      failed_when: false

    - name: Untrack files folder
      ansible.builtin.command: git rm -r --cached files
      args:
        chdir: "{{ project_dir }}"
      failed_when: false

    - name: Init repo
      ansible.builtin.command: git init
      args:
        chdir: "{{ project_dir }}"

    - name: Configure git user
      ansible.builtin.command: git config user.name Ansible-Deploy-Bot
      args:
        chdir: "{{ project_dir }}"
      failed_when: false

    - name: Add remote
      ansible.builtin.shell: git remote remove origin 2> /dev/null; git remote add origin {{ github_repo }}
      args:
        chdir: "{{ project_dir }}"
      failed_when: false

    - name: Set branch main
      ansible.builtin.command: git branch -M main
      args:
        chdir: "{{ project_dir }}"
      failed_when: false

    - name: Stage all files
      ansible.builtin.command: git add -A
      args:
        chdir: "{{ project_dir }}"
      register: git_commit
      failed_when: false
      changed_when: git_commit.rc == 0

    - name: Push to Github
      ansible.builtin.shell: git push -u origin main 2>&1
      args:
        chdir: "{{ project_dir }}"
      register: git_push
      failed_when: false

    - name: Push verdict
      ansible.builtin.debug:
        msg: "{{ 'PUSH_FAILED - see output above' if git_push.rc !=0 else 'PUSH_OK' }}"

    - name: Result
      ansible.builtin.debug:
        var: git_push

    - name: Count tracked backups
      ansible.builtin.command: git ls-files
      args:
        chdir: "{{ project_dir }}"
      register: all_files
      changed_when: false

    - name: Show tracked file count
      ansible.builtin.debug:
        var: all_files.stdout_lines
