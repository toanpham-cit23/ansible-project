---
- name: Push Ansible Project to GitHub
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    project_dir: /root/ansible-project
    github_repo: "https://{{ github_token | default('') }}@github.com/toanpham-cit23/ansible-project.git"

  tasks:
    - name: Load token file if it exists
      ansible.builtin.include_vars:
        file: "{{ project_dir }}/token.yml"
      failed_when: false
      no_log: true

    - name: Stop if the GitHub token is missing
      ansible.builtin.fail:
        msg: "{{ project_dir }}/token.yml not found or has no github_token. Run 08_vault.yml first."
      when: github_token | default('') | length == 0

    - name: Safety check - never push plaintext token
      ansible.builtin.shell: | 
        if grep -q ANSIBLE_VAULT {{ project_dir }}/token.yml; then
          echo "TOKEN_ENCRYPTED"
        else
          echo "TOKEN_PLAINTEXT"
        fi
      register: token_safety
      changed_when: false

    - name: Stop push if token is not encrypted
      ansible.builtin.fail:
        msg: "DANGER - token.yml is plaintext. Run 08_vault.yml first, then push."
      when: token_safety.stdout != "TOKEN_ENCRYPTED"

    - name: Show token safety result
      ansible.builtin.debug:
        var: token_safety.stdout_lines

    # force: no -> keeps the tracked .gitignore intact, only creates it if missing
    - name: Ensure gitignore exists
      ansible.builtin.copy:
        dest: "{{ project_dir }}/.gitignore"
        force: no
        content: |
          # Backups and generated configs - never commit router configs
          backups/
          **/backups/
          *.conf
          *.retry

          # Secrets
          token.yml
          .vault_pass

          # Offline .apk packages (tzdata / snmp / zabbix).
          # Intentionally not in git: copy them to files/ on the control node by hand.
          files/
          devnull

          # Misc
          *.log
          __pycache__/
          .DS_Store

    - name: Untrack token file
      ansible.builtin.command: git rm --cached token.yml
      args:
        chdir: "{{ project_dir }}"
      failed_when: false

    - name: Untrack vault pass file
      ansible.builtin.command: git rm --cached .vault_pass
      args:
        chdir: "{{ project_dir }}"
      failed_when: false

    - name: Untrack playbooks backups
      ansible.builtin.command: git rm -r --cached playbooks/backups
      args:
        chdir: "{{ project_dir }}"
      failed_when: false

    - name: Untrack root backups
      ansible.builtin.command: git rm -r --cached backups
      args:
        chdir: "{{ project_dir }}"
      failed_when: false

    - name: Untrack files folder
      ansible.builtin.command: git rm -r --cached files
      args:
        chdir: "{{ project_dir }}"
      failed_when: false

    - name: Init repo
      ansible.builtin.command: git init
      args:
        chdir: "{{ project_dir }}"

    - name: Configure git user
      ansible.builtin.command: git config user.name Ansible-Deploy-Bot
      args:
        chdir: "{{ project_dir }}"
      failed_when: false

    - name: Add remote
      ansible.builtin.shell: git remote remove origin 2> /dev/null; git remote add origin {{ github_repo }}
      args:
        chdir: "{{ project_dir }}"
      failed_when: false

    - name: Set branch main
      ansible.builtin.command: git branch -M main
      args:
        chdir: "{{ project_dir }}"
      failed_when: false

    - name: Stage all files
      ansible.builtin.command: git add -A
      args:
        chdir: "{{ project_dir }}"
      register: git_commit
      failed_when: false
      changed_when: git_commit.rc == 0

    - name: Push to Github
      ansible.builtin.shell: git push -u origin main 2>&1
      args:
        chdir: "{{ project_dir }}"
      register: git_push
      failed_when: false

    - name: Push verdict
      ansible.builtin.debug:
        msg: "{{ 'PUSH_FAILED - see output above' if git_push.rc !=0 else 'PUSH_OK' }}"

    - name: Result
      ansible.builtin.debug:
        var: git_push

    - name: Count tracked backups
      ansible.builtin.command: git ls-files
      args:
        chdir: "{{ project_dir }}"
      register: all_files
      changed_when: false

    - name: Show tracked file count
      ansible.builtin.debug:
        var: all_files.stdout_lines
