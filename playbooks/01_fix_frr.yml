---
- name: Force start FRR and Apply Loopback
  hosts: routers
  gather_facts: no
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: Detect FRR service name
      ansible.builtin.shell: |
        if rc-service frr status > /dev/null 2>&1; then
          echo FRR
        elif rc-service zebra status > /dev/null 2>&1; then
          echo ZEBRA
        elif ls /etc/init.d/frr > /dev/null 2>&1; then
          echo FRR_STOPPED
        elif ls /etc/init.d/zebra > /dev/null 2>&1; then
          echo ZEBRA_STOPPED
        else
          echo NO_INIT_SCRIPT
        fi
      register: frr_detect
      changed_when: false
      failed_when: false

    - name: Show detection result
      ansible.builtin.debug:
        var: frr_detect.stdout

    - name: Enable and force start frr service
      ansible.builtin.shell: |
        rc-update add frr default
        rc-service frr stop
        rc-service frr start
        sleep 2
        rc-service frr status
      register: frr_start_frr
      when: frr_detect.stdout != "ZEBRA_STOPPED"
      failed_when: false

    - name: Enable and force start zebra service
      ansible.builtin.shell: |
        rc-update add zebra default
        rc-update add ospfd default
        rc-service zebra restart
        rc-service ospfd restart
        sleep 2
      register: frr_start_zebra
      when: frr_detect.stdout == "ZEBRA_STOPPED"
      failed_when: false

    - name: Enable ospfd daemon in FRR config
      ansible.builtin.shell: |
        sed -i 's/ospfd=no/ospfd=yes/' /etc/frr/daemons
        rc-service frr restart
        sleep 2
      register: ospfd_enable
      failed_when: false

    - name: Verify FRR daemons running
      ansible.builtin.shell: |
        ps | grep zebra | grep -v grep > /dev/null && echo ZEBRA_RUNNING || echo ZEBRA_DEAD
        ps | grep ospfd | grep -v grep > /dev/null && echo OSPFD_RUNNING || echo OSPFD_DEAD
        vtysh -c 'show version' > /dev/null 2>&1 && echo VTYSH_OK || echo VTYSH_FAIL
      register: daemon_check
      changed_when: false
      failed_when: false

    - name: Show daemon status
      ansible.builtin.debug:
        var: daemon_check.stdout_lines

    # Every task above has failed_when: false on purpose - it has to try
    # several service layouts before it knows which one applies. The cost is
    # that a frr that never started also continues quietly: the loopback task
    # is then skipped and the play ends green. This is the only place that can
    # tell the difference, so it is the one that fails.
    - name: Fail when FRR did not come up
      ansible.builtin.fail:
        msg: >-
          FRR is not running on {{ inventory_hostname }} after the start
          attempts. Daemon check said: {{ daemon_check.stdout_lines | join(' | ') }}.
          Nothing in this play was applied; the rest of the pipeline would be
          configuring a daemon that is not there.
      when: "'ZEBRA_RUNNING' not in daemon_check.stdout or 'VTYSH_OK' not in daemon_check.stdout"

    - name: Configure loopback interface
      ansible.builtin.shell: |
        vtysh -c 'conf t' -c 'interface lo' -c 'ip address {{ loopback_ip }}/32' -c 'end' -c 'wr mem'
      register: lo_result
      when: "'VTYSH_OK' in daemon_check.stdout"
      failed_when: false

    - name: Show loopback result
      ansible.builtin.debug:
        var: lo_result.stdout_lines

    - name: Verify loopback in running config
      ansible.builtin.shell: |
        vtysh -c 'show run' | grep -q "interface lo" && echo LOOPBACK_OK || echo LOOPBACK_MISSING
      register: lo_verify
      changed_when: false
      failed_when: false

    - name: Show loopback verification
      ansible.builtin.debug:
        var: lo_verify.stdout

    # 00_hostname.yml runs before this play, so on a first deployment FRR was
    # not up yet and it deferred the FRR hostname to here. 07_check.yml asserts
    # `hostname <inventory_hostname>` appears in `show run`, so this has to
    # actually happen or that check can never pass.
    - name: Set the FRR hostname now that the daemons are running
      ansible.builtin.shell: |
        TERM=dumb vtysh -c 'conf t' -c 'hostname {{ inventory_hostname }}' \
          -c 'end' -c 'write memory'
      register: frr_hostname_fix
      when: "'VTYSH_OK' in daemon_check.stdout"
      changed_when: "'%' not in frr_hostname_fix.stdout"
      failed_when: >-
        frr_hostname_fix.rc != 0 or
        'Unknown command' in frr_hostname_fix.stdout or
        'Incomplete command' in frr_hostname_fix.stdout

    - name: Verify the FRR hostname
      ansible.builtin.shell: |
        TERM=dumb vtysh -c 'show run' 2>/dev/null \
          | grep -q '^hostname {{ inventory_hostname }}$' \
          && echo FRR_HOSTNAME_OK || echo FRR_HOSTNAME_MISSING
      register: frr_hostname_verify
      when: "'VTYSH_OK' in daemon_check.stdout"
      changed_when: false
      failed_when: "false"

    - name: Fail when the FRR hostname could not be set
      ansible.builtin.fail:
        msg: >-
          FRR is running on {{ inventory_hostname }} but its hostname is not
          {{ inventory_hostname }}. 07_check.yml would report this as a
          configuration drift on every run.
      when:
        - "'VTYSH_OK' in daemon_check.stdout"
        - "'FRR_HOSTNAME_OK' not in frr_hostname_verify.stdout"

    - name: Result
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} loopback={{ loopback_ip }} result={{ lo_verify.stdout }}"
