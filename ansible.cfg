[defaults]
inventory = /root/ansible-project/hosts.ini
vault_password_file = /root/ansible-project/.vault_pass

# Lab routers use password auth with fresh host keys after every rebuild,
# so host key checking would block the first connection.
host_key_checking = False

# Alpine routers always ship python3 at this path (also set per play).
interpreter_python = /usr/bin/python3

# Keep runs clean and repeatable.
retry_files_enabled = False
deprecation_warnings = False
timeout = 30
stdout_callback = default

[ssh_connection]
# Reuse one SSH session per host: much faster on multi-play runs.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
