[defaults]
# Relative to this file, so a clone anywhere works without editing. The old
# absolute /root/ansible-project/hosts.ini silently pointed at another tree.
inventory = ./hosts.ini

# vault_password_file was set unconditionally here, but .vault_pass is
# gitignored and does not exist in a fresh clone. Ansible treats a missing
# vault password file as an error, so every run aborted before the first task.
# Only 08_vault.yml and 09_git_github.yml need it, and both pass
# --vault-password-file explicitly, so enable it there rather than globally:
#
#   ansible-playbook playbooks/08_vault.yml --vault-password-file .vault_pass
#
# vault_password_file = ./.vault_pass

# Lab routers use password auth with fresh host keys after every rebuild,
# so host key checking would block the first connection.
host_key_checking = False

# Alpine routers always ship python3 at this path (also set per play).
interpreter_python = /usr/bin/python3

# Keep runs clean and repeatable.
retry_files_enabled = False
deprecation_warnings = False
timeout = 30
stdout_callback = default

[ssh_connection]
# Reuse one SSH session per host: much faster on multi-play runs.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
