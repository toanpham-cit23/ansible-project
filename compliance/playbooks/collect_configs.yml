---
- name: Collect FRR running configuration for compliance audit
  hosts: routers
  gather_facts: false
  become: false
  tasks:
    - name: Read FRR running configuration
      ansible.builtin.shell: "TERM=dumb vtysh -c 'show running-config'"
      register: frr_config
      changed_when: false
      failed_when: frr_config.rc != 0 or (frr_config.stdout | trim | length == 0)

    - name: Save configuration on Controller
      ansible.builtin.copy:
        content: "{{ frr_config.stdout }}\n"
        dest: "{{ playbook_dir }}/../reports/actual/{{ inventory_hostname }}.conf"
        mode: '0600'
      delegate_to: localhost

# Switches and simulated PCs do not run FRR, so `vtysh` does not exist there.
# Their desired state is the SNMP agent configuration plus basic identity.
# Collect the same text shape the auditor reads for a router, so one audit
# loop can handle both without a special case in run_compliance.py.
- name: Collect switch configuration for compliance audit
  hosts: switches
  gather_facts: false
  become: false
  tasks:
    # These devices live on the `lab-users` macvlan. `docker exec` is used
    # deliberately and is not a workaround for a broken network: the running
    # config inside the container IS the device's real config, and reading it
    # this way means the audit cannot be fooled by a stale copy on disk.
    #
    # The controller can now also reach them directly (the `mvl0` shim in
    # files/sim/simctl.py), so SSH would work too - but these are containers
    # running a bare `alpine` with no sshd, so there is nothing to SSH into.
    - name: Read switch SNMP and identity configuration from its container
      ansible.builtin.shell: |
        echo "# hostname"
        docker exec {{ inventory_hostname }} sh -c 'hostname' 2>/dev/null || true
        echo "# snmpd.conf"
        docker exec {{ inventory_hostname }} sh -c 'cat /etc/snmp/snmpd.conf' 2>/dev/null || true
        echo "# interfaces"
        docker exec {{ inventory_hostname }} sh -c 'ip -brief addr' 2>/dev/null || true
      register: sw_config
      changed_when: false
      failed_when: sw_config.rc != 0

    - name: Save switch configuration on Controller
      ansible.builtin.copy:
        content: "{{ sw_config.stdout }}\n"
        dest: "{{ playbook_dir }}/../reports/actual/{{ inventory_hostname }}.conf"
        mode: '0600'
      delegate_to: localhost
