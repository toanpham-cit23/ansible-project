# Lab inventory - FRR routers running Alpine Linux.
# NOTE: passwords are plaintext here for lab convenience. For anything shared,
# move them into an ansible-vault file and reference the variables instead.
[routers]
r1 ansible_host=192.168.23.11 loopback_ip=1.1.1.1 ansible_user=root ansible_password=r1
r2 ansible_host=192.168.23.12 loopback_ip=2.2.2.2 ansible_user=root ansible_password=r2
r3 ansible_host=192.168.23.13 loopback_ip=3.3.3.3 ansible_user=root ansible_password=r3

[routers:vars]
ansible_connection=ssh
# Informational only: the playbooks drive FRR through shell + vtysh, not network_cli.
ansible_network_os=frr
